name: CI

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Run pytest
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.11, 3.14, 3.15]
      fail-fast: true

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked --no-build --all-extras

      - name: Run pytest
        run: |
          uv run pytest
